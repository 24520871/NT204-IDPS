# Example ZeekControl node configuration.
#
# This example has a standalone node ready to go except for possibly changing
# the sniffing interface.

# This is a complete standalone configuration.  Most likely you will
# only need to change the interface.
[logger]
type=logger
host=localhost

[manager]
type=manager
host=localhost

[proxy]
type=proxy
host=localhost

[worker-ext]
type=worker
host=localhost
interface=enp0s3

[worker-dmz]
type=worker
host=localhost
interface=enp0s8

[worker-lan]
type=worker
host=localhost
interface=enp0s9
